[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridqueue"
version = "1.7.0"
description = "Harmonizer of statutory grid-connection disclosures into panel data for queue research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pdfplumber>=0.11", "requests>=2.31", "pyarrow>=14", "openpyxl>=3.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8.0", "matplotlib>=3.7"]

[project.scripts]
gridqueue = "gridqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
