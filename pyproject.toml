[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridqueue"
version = "1.4.0"
description = "Harmonizator ustawowych ujawnien przylaczeniowych do sieci elektroenergetycznej"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pdfplumber>=0.11", "requests>=2.31", "pyarrow>=14", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
gridqueue = "gridqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
