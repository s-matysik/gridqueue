name: testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalacja pakietu z ekstrasem testowym
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Testy
        run: python -m pytest -q -rs
      - name: Zgodnosc deklarowanej wersji
        shell: python
        run: |
          import tomllib, pathlib, gridqueue
          pj = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          assert pj["project"]["version"] == gridqueue.__version__, (
              pj["project"]["version"], gridqueue.__version__)
          print("wersja zgodna:", gridqueue.__version__)
